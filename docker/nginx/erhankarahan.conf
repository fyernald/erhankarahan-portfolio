# nginx equivalent of docker/caddy/Caddyfile, for hosts that run nginx instead of Caddy.
# Install as /etc/nginx/conf.d/erhankarahan.conf and start the stack with
# docker-compose.nginx.yml so the app listens on 127.0.0.1:3000 (or APP_PORT from .env;
# change the upstream below to match).
# Certificates are expected from certbot (`certbot certonly --nginx -d erhankarahan.com -d www.erhankarahan.com`),
# obtained before this file is enabled, since nginx refuses to start with missing certificate files.

upstream erhankarahan_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name erhankarahan.com www.erhankarahan.com;
    return 301 https://erhankarahan.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.erhankarahan.com;
    ssl_certificate     /etc/letsencrypt/live/erhankarahan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erhankarahan.com/privkey.pem;
    return 301 https://erhankarahan.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erhankarahan.com;
    ssl_certificate     /etc/letsencrypt/live/erhankarahan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erhankarahan.com/privkey.pem;

    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite client-supplied values so the app can trust them for rate limiting.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Large media uploads (videos up to 2 GB) are streamed straight to the app.
    location = /api/uploads {
        client_max_body_size 2100m;
        proxy_request_buffering off;
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
        proxy_pass http://erhankarahan_app;
    }

    location / {
        proxy_pass http://erhankarahan_app;
    }
}
