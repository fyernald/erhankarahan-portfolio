# Local development services:  docker compose -f docker-compose.dev.yml up -d
# Ports are bound to 127.0.0.1 only. Run the app itself with `npm run dev`.
name: erhankarahan-dev

services:
  postgres:
    image: postgres:17-alpine
    # Come back up after Docker Desktop or the machine restarts.
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]

  storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/docker-entrypoint-s3.sh"]
    environment:
      S3_ACCESS_KEY: devaccesskey
      S3_SECRET_KEY: devsecretkey123
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - ./docker/seaweedfs/entrypoint.sh:/docker-entrypoint-s3.sh:ro
      - storage-data:/data

  clamav:
    image: clamav/clamav:stable
    profiles: [antivirus]
    restart: unless-stopped
    ports: ["127.0.0.1:3310:3310"]
    volumes: [clamav-db:/var/lib/clamav]

volumes:
  postgres-data:
  storage-data:
  clamav-db:
