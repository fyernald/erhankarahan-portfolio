# Production stack for the VPS:  docker compose up -d --build
# Only Caddy publishes ports; every other service lives on the private network.
name: erhankarahan

x-app-env: &app-env
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolio}
    S3_ENDPOINT: http://storage:8333
    S3_FORCE_PATH_STYLE: "true"
    CLAMAV_HOST: clamav
    CLAMAV_PORT: "3310"

services:
  app:
    <<: *app-env
    build: { context: ., target: runner }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      storage: { condition: service_started }
      clamav: { condition: service_started }
    volumes:
      - upload-tmp:/app/tmp
      - next-cache:/app/.next/cache
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [internal, edge]

  migrate:
    <<: *app-env
    build: { context: ., target: migrator }
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    security_opt: [no-new-privileges:true]
    networks: [internal]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
    networks: [internal]

  storage:
    # S3-compatible object storage (Apache-2.0). Any S3 provider works via the S3_* variables.
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-latest}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/docker-entrypoint-s3.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      STORAGE_LIMIT_GB: ${STORAGE_LIMIT_GB:-30}
    volumes:
      - ./docker/seaweedfs/entrypoint.sh:/docker-entrypoint-s3.sh:ro
      - storage-data:/data
    security_opt: [no-new-privileges:true]
    networks: [internal]

  clamav:
    # Antivirus daemon used to scan every upload. Needs ~1.5 GB RAM.
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      start_period: 300s
      retries: 3
    # `edge` gives freshclam outbound internet to update virus definitions; no ports
    # are published, so nothing outside Docker can reach clamd.
    networks: [internal, edge]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-erhankarahan.com}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt: [no-new-privileges:true]
    networks: [edge]

networks:
  internal:
    internal: true
  edge: {}

volumes:
  postgres-data:
  storage-data:
  clamav-db:
  caddy-data:
  caddy-config:
  upload-tmp:
  next-cache:
